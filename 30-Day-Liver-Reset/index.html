function check(key,text,checked,disabled=false){return `<label class="check"><input type="checkbox" data-check="${key}" ${checked?'checked':''} ${disabled?'disabled':''}><span>${text}</span></label>`}

function renderToday(){const d=day(),elapsed=Math.max(0,Math.min(30,todayIndex()+1)),s=score(d);return `<section class="hero card"><div class="row"><span class="badge">🌿 ดูแลตัวเองไปด้วยกัน</span><span class="small">${todayIndex()<0?'เริ่ม 21 ก.ย.':todayIndex()>29?'ครบช่วง 30 วัน':'วันที่ '+(todayIndex()+1)+' ของโปรแกรม'}</span></div><div class="row section"><div><p class="small">น้ำหนักล่าสุดที่บันทึก</p><p class="big">${fmt(current())} <span style="font-size:17px;letter-spacing:0">กก.</span></p><p class="small">เป้าหมาย ${fmt(state.settings.target)} กก.</p></div><div class="ring" style="--pct:${elapsed/30*100}%"><div><strong>${Math.round(elapsed/30*100)}%</strong><small style="color:#bed0c4">ผ่านไป ${elapsed}/30 วัน</small></div></div></div><div class="grid stats"><div><p class="small">น้ำหนักที่ลดลง</p><strong style="font-size:23px">${fmt(lost())} <small>กก.</small></strong></div><div><p class="small">วันที่เหลือตามปฏิทิน</p><strong style="font-size:23px">${30-elapsed} <small>วัน</small></strong></div></div></section>
${state.settings.start===null?'<div class="notice section">เริ่มต้นด้วยน้ำหนักของคุณ <button data-action="settings">ตั้งค่าเป้าหมาย →</button></div>':''}
${nutritionCard()}<div class="row section"><h2>เช็กอินประจำวัน</h2><span class="badge">${s}% สำเร็จ</span></div><div class="bar"><span style="width:${s}%"></span></div><p class="small">คะแนนของวันที่เลือก • 8 รายการ รายการละ 12.5%</p><div class="card section"><form id="weightForm"><label for="weight">น้ำหนักวันที่เลือก (กก.)</label><div class="row"><input id="weight" name="weight" type="number" inputmode="decimal" min="20" max="400" step="0.1" value="${d.weight??''}" placeholder="เช่น 66.0"><button class="primary">บันทึก</button></div><small>เว้นว่างแล้วบันทึกเพื่อลบค่าน้ำหนักวันนี้</small></form></div><div class="card section">${check('weight','ชั่งน้ำหนัก <small>อิงค่าที่บันทึก</small>',d.weight!==null,true)}${check('breakfastComplete','มื้อเช้า',d.breakfastComplete)}${check('lunchComplete','มื้อกลางวัน',d.lunchComplete)}${check('dinnerComplete','มื้อเย็น',d.dinnerComplete)}${check('workoutComplete','ออกกำลัง / กิจกรรมวันพัก',d.workoutComplete)}${check('steps','เดิน 8,000–10,000 ก้าว <small>อิงก้าวที่กรอก</small>',d.steps>=8000,true)}${check('waterComplete',`ดื่มน้ำตามเป้าหมาย ${fmt(state.settings.water)} มล.`,d.waterComplete)}${check('sleepComplete',`นอนตามเป้าหมาย ${fmt(state.settings.sleep)} ชม.`,d.sleepComplete)}</div>
<div class="card section"><div class="row"><h3>🚶 ก้าวเล็ก ๆ ของวันนี้</h3><span class="badge">${d.steps>=10000?'ยอดเยี่ยม':d.steps>=8000?'ถึงเป้าหมาย':'ค่อย ๆ ทำ'}</span></div><div class="metric section">${fmt(d.steps??0)} <small>/ 10,000 ก้าว</small></div><div class="bar"><span style="width:${Math.min(100,(d.steps??0)/100)}%"></span></div><form id="stepsForm" class="row"><input aria-label="จำนวนก้าว" name="steps" type="number" inputmode="numeric" min="0" max="100000" step="1" value="${d.steps??''}" placeholder="กรอกก้าวเอง"><button class="primary">บันทึก</button></form><small>ไม่เชื่อมต่อ Apple Health • เป้าหมายสำเร็จตั้งแต่ 8,000 ก้าว</small></div><div class="card section"><div class="row"><div><h3>เมนูวันนี้</h3><p class="small">${totalCalories(selected)} kcal โดยประมาณ · โปรตีน ${menu[selected%7].reduce((n,k)=>n+foods[k][3],0)} กรัม</p></div><button data-go="meals">ดูเมนู →</button></div></div><p class="notice section">งดแอลกอฮอล์ • เลี่ยงน้ำหวาน ขนม เบเกอรี่ และของทอด<br>เป้าหมายลด 7 กก. เป็นเป้าหมายตามแผนผู้ใช้ ผลจริงแตกต่างกัน ไม่ใช่ผลลัพธ์ที่รับประกัน</p>`}
/* Meals and exercise detail */
function renderMeals(){return `${nutritionCard()}${foodLedger()}<div class="section"></div><div class="row"><div><div class="eyebrow muted">NOURISH YOUR DAY</div><h2>กินอย่างมีแผน</h2></div><span class="badge">${totalCalories(selected)} kcal</span></div><p class="small section">เมนูรอบที่ ${selected%7+1}/7 • น้ำหนักอาหารสุกพร้อมกิน ยกเว้นที่ระบุ • ไม่เติมน้ำมัน/น้ำตาล</p><div class="mealgrid stack section">${menu[selected%7].map((key,i)=>{const f=foods[key],k=['breakfastComplete','lunchComplete','dinnerComplete'][i];return `<article class="card meal">${art(f[4],f[5],f[0])}<div class="body"><div class="eyebrow muted">${['มื้อเช้า','มื้อกลางวัน','มื้อเย็น'][i]}</div><h3>${f[0]}</h3><p class="small">${f[1]}</p><p class="section"><strong>≈ ${f[2]} kcal</strong> <small>โปรตีน ${f[3]} กรัม</small></p>${check(k,'กินแล้ว',day()[k])}</div></article>`}).join('')}</div><div class="card section"><h3>ต้ม · นึ่ง · ย่าง · Air Fryer</h3><p class="small">ปรุงรสพอประมาณ หากเพิ่มซอส น้ำมัน หรือเครื่องดื่ม ต้องนับรวมพลังงานด้วย ค่าของเมนูไม่ใช่การวัดการกินจริง และการติ๊กอาหารไม่ยืนยันว่ากินครบพลังงาน</p></div>${notice()}`}
function renderWorkout(){const w=workout[selected%7];return `<div class="eyebrow muted">MOVE WITH CARE</div><h2>${w.name}</h2><p class="muted">${w.circuit?'ทำวน 3 รอบ · ครบทุกรายการจึงเริ่มรอบใหม่':'ทำตามกำลัง · พักระหว่างเซ็ต 45 วินาที'}</p><div class="notice section">ยืนยันความหนักและปริมาณการออกกำลังกับแพทย์ขณะใช้แผนพลังงานต่ำ ไม่จำเป็นต้องฝืนทำครบ วอร์มอัปและคูลดาวน์ตามที่แพทย์อนุญาต</div><div class="stack section">${w.items.map((e,i)=>`<button class="exercise" data-ex="${i}">${art(e[0],moves[e[0]][1],moves[e[0]][0])}<div class="meta"><h3>${moves[e[0]][0]}</h3><p class="small">${e[1]} × ${e[2]} ${w.circuit?'รอบ':'เซ็ต'}</p></div><span>›</span></button>`).join('')}</div><button class="primary section" style="width:100%" data-action="startWorkout">${day().workoutComplete?'เริ่มอีกครั้ง':'เริ่มออกกำลัง'} ▷</button><div class="card section">${check('workoutComplete','ทำกิจกรรมวันนี้แล้ว',day().workoutComplete)}</div>${notice()}<p class="small section">${exerciseSafety}</p>`}
function showModal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;if(!$('modal').open)$('modal').showModal()}
function exerciseDetail(i){const e=workout[selected%7].items[i],m=moves[e[0]];showModal(m[0],`${art(e[0],m[1],m[0])}<p><strong>${e[1]} × ${e[2]} เซ็ต</strong></p><p>พัก 45 วินาทีระหว่างเซ็ต</p><p class="section">${m[2]}</p><p class="small section">${exerciseSafety}</p>`)}
/* Guided workout: circuit order, deadline-based rest, explicit completion */
function startWorkout(){if(!confirm('ทำตามระดับที่แพทย์อนุญาต และหยุดเมื่อมีอาการผิดปกติ พร้อมเริ่มหรือไม่?'))return;const w=workout[selected%7],queue=[];if(w.circuit){for(let r=1;r<=3;r++)w.items.forEach(e=>queue.push({e,set:r}))}else w.items.forEach(e=>{for(let s=1;s<=e[2];s++)queue.push({e,set:s})});session={day:selected,queue,index:0,restUntil:null};showSession()}
function showSession(){const q=session.queue[session.index],e=q.e,m=moves[e[0]];showModal('โหมดออกกำลัง',`${art(e[0],m[1],m[0])}<div class="workcenter"><span class="badge">DAY ${session.day+1} · ขั้น ${session.index+1}/${session.queue.length}</span><h2 class="section">${m[0]}</h2><p>เซ็ต / รอบ ${q.set} / ${e[2]}</p><div class="metric">${e[1]}</div><div id="restArea" class="section">${session.restUntil?'':`<button class="primary" data-action="completeSet">ทำเซ็ตนี้เสร็จแล้ว ✓</button>`}</div></div><div class="notice">${exerciseSafety}<br>ถ้าเจ็บหน้าอกหรืออาการรุนแรง โทร 1669</div>`);if(session.restUntil)tick()}
function completeSet(){if(!session||session.restUntil)return;if(session.index===session.queue.length-1){state.days[session.day].workoutComplete=true;const ok=save();session=null;clearInterval(timer);showModal('ทำกิจกรรมสำเร็จ ✓',`<div class="workcenter"><div class="timer">🌿</div><p>${ok?'บันทึกการออกกำลังแล้ว':'ยังบันทึกไม่ได้ กรุณา Export ก่อนปิดหน้า'}</p><button class="primary section" data-action="finishWorkout">กลับไปดูแผน</button></div>`);render();return}session.restUntil=Date.now()+45000;showSession();clearInterval(timer);timer=setInterval(tick,250)}
function tick(){if(!session?.restUntil)return;const secs=Math.max(0,Math.ceil((session.restUntil-Date.now())/1000));if(!secs){nextSet();return}const area=$('restArea');if(area)area.innerHTML=`<p class="muted">พักระหว่างเซ็ต</p><div class="timer">00:${String(secs).padStart(2,'0')}</div><button data-action="skipRest">ข้ามช่วงพัก</button>`}
function nextSet(){if(!session)return;clearInterval(timer);session.restUntil=null;session.index++;showSession()}
function closeModal(){if(session&&!confirm('ออกจากโหมดออกกำลัง? เซ็ตที่ยังไม่ครบจะไม่บันทึกเป็นสำเร็จ'))return;clearInterval(timer);session=null;$('modal').close()}
/* Accessible SVG charts and summary */
function weightChart(){const vals=state.days.map(d=>d.weight),s=state.settings.start,t=state.settings.target,all=vals.filter(v=>v!==null).concat([s,t].filter(v=>v!==null));if(!all.length)return '<p class="small section">ตั้งน้ำหนักเริ่มต้นและบันทึกน้ำหนักเพื่อแสดงกราฟ</p>';const lo=Math.floor(Math.min(...all)-1),hi=Math.ceil(Math.max(...all)+1),x=i=>38+i*10.7,y=v=>155-(v-lo)/(hi-lo)*122;let lines='';[lo,(lo+hi)/2,hi].forEach(v=>lines+=`<line x1="38" y1="${y(v)}" x2="350" y2="${y(v)}" stroke="var(--line)"/><text x="1" y="${y(v)+4}" fill="currentColor" font-size="10">${fmt(v)}</text>`);let points=vals.map((v,i)=>v===null?null:[x(i),y(v),v,i]).filter(Boolean);return `<svg class="chart" viewBox="0 0 365 185" role="img" aria-label="กราฟน้ำหนัก 30 วัน หน่วยกิโลกรัม">${lines}${s!==null&&t!==null?`<path d="M ${x(0)} ${y(s)} L ${x(29)} ${y(t)}" stroke="var(--orange)" stroke-width="2" stroke-dasharray="5 5" fill="none"/>`:''}<polyline points="${points.map(p=>p.slice(0,2).join(',')).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="3"/>${points.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--accent)"><title>วันที่ ${p[3]+1}: ${p[2]} กก.</title></circle>`).join('')}<text x="38" y="178" fill="currentColor" font-size="10">DAY 1</text><text x="302" y="178" fill="currentColor" font-size="10">DAY 30</text></svg><div class="legend"><span>● น้ำหนักจริง</span><span style="color:var(--orange)">┄ แนวโน้มเป้าหมาย</span></div><p class="small">เส้นจริงเชื่อมเฉพาะวันที่บันทึก • เป้าหมายเป็นเส้นอ้างอิง ไม่ใช่การคาดการณ์</p>`}
function completionChart(){return `<svg class="chart" viewBox="0 0 365 135" role="img" aria-label="กราฟคะแนนเช็กลิสต์รายวัน 0 ถึง 100 เปอร์เซ็นต์"><text x="0" y="16" fill="currentColor" font-size="9">100%</text>${state.days.map((d,i)=>`<rect x="${35+i*10.6}" y="${110-score(d)*.9}" width="7" height="${Math.max(1,score(d)*.9)}" rx="2" fill="${score(d)?'var(--accent)':'var(--line)'}"><title>วันที่ ${i+1}: ${score(d)}%</title></rect>`).join('')}<text x="35" y="130" fill="currentColor" font-size="10">DAY 1</text><text x="300" y="130" fill="currentColor" font-size="10">DAY 30</text></svg>`}
function renderProgress(){const n=Math.max(0,Math.min(30,todayIndex()+1)),relevant=state.days.slice(0,n),steps=relevant.filter(d=>d.steps!==null),meals=relevant.reduce((sum,d)=>sum+['breakfastComplete','lunchComplete','dinnerComplete'].filter(k=>d[k]).length,0),metrics=[['น้ำหนักลด (กก.)',fmt(lost())],['วันครบทุกกิจกรรม',`${relevant.filter(d=>score(d)===100).length} / ${n}`],['วันออกกำลังแล้ว',relevant.filter(d=>d.workoutComplete).length],['ก้าวเฉลี่ย / วันที่กรอก',steps.length?Math.round(steps.reduce((s,d)=>s+d.steps,0)/steps.length).toLocaleString():'—'],['มื้อที่ทำตามแผน',n?Math.round(meals/(n*3)*100)+'%':'—']];return `<div class="eyebrow muted">YOUR JOURNEY</div><h2>ทุกความตั้งใจ มีความหมาย</h2>${renderNutritionStats()}<div class="grid section">${metrics.map(([k,v])=>`<div class="card"><p class="small">${k}</p><div class="metric">${v}</div></div>`).join('')}</div><p class="small section">สถิติกิจกรรมและอาหารนับถึงวันนี้ ${n} วัน ไม่รวมวันอนาคต • ค่าเฉลี่ยก้าวนับเฉพาะวันที่กรอก (รวม 0)</p><div class="card section"><h3>น้ำหนักตลอด 30 วัน</h3><div class="grid section"><p class="small">เริ่มต้น <strong>${fmt(state.settings.start)}</strong></p><p class="small">ล่าสุด <strong>${fmt(current())}</strong></p><p class="small">ลดลง <strong>${fmt(lost())}</strong></p><p class="small">เหลือถึงเป้าหมาย <strong>${current()!==null&&state.settings.target!==null?fmt(Math.max(0,current()-state.settings.target)):'—'}</strong></p></div>${weightChart()}</div><div class="card section"><h3>คะแนนกิจกรรมรายวัน</h3>${completionChart()}</div><div class="card section"><h3>หมุดหมายของคุณ</h3><div class="toolbar section">${[2,4,5,7].map(v=>`<span class="badge" style="opacity:${lost()!==null&&lost()>=v?1:.45}">${lost()!==null&&lost()>=v?'🏅':'○'} −${v} กก.</span>`).join('')}</div><p class="small section">แสดงตามน้ำหนักล่าสุด ไม่ต้องเร่งลดเพื่อเก็บเหรียญ</p></div><div class="card section"><h3>Before / After</h3><p class="small">ภาพวันที่ 1 และวันที่ 30 • เลือกภาพย้อนหลังได้</p><div class="grid p /* Photos in IndexedDB; compressed image backup is included in JSON */
let dbPromise;
function db(){if(!dbPromise)dbPromise=new Promise((resolve,reject)=>{if(!window.indexedDB){reject(Error('ไม่รองรับ IndexedDB'));return}const r=indexedDB.open('liver-reset-photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});return dbPromise}
async function photoOp(mode,fn){const d=await db();return new Promise((resolve,reject)=>{const tx=d.transaction('photos',mode),req=fn(tx.objectStore('photos'));tx.oncomplete=()=>resolve(req?.result);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||Error('ยกเลิกการบันทึก'))})}
async function loadPhotos(){for(const key of ['before','after'])try{const b=await photoOp('readonly',s=>s.get(key));const el=$('photo-'+key);if(b&&el){const url=URL.createObjectURL(b);photoURLs.push(url);const im=new Image();im.src=url;im.alt=key==='before'?'ภาพก่อนเริ่ม':'ภาพหลังจบ';el.replaceChildren(im)}}catch(e){toast('เปิดรูปในเครื่องไม่ได้ กรุณาใช้ Safari โหมดปกติ')}}
async function compress(file){if(!file.type.startsWith('image/'))throw Error('กรุณาเลือกไฟล์รูป');if(file.size>25*1024*1024)throw Error('รูปต้องไม่เกิน 25 MB');const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();const ratio=Math.min(1,1200/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*ratio);c.height=Math.round(img.height*ratio);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return await new Promise((r,j)=>c.toBlob(b=>b?r(b):j(Error('แปลงภาพไม่สำเร็จ')),'image/jpeg',.82))}catch(e){throw Error('อ่านรูปไม่ได้ กรุณาใช้ JPG, PNG หรือภาพหน้าจอ')}finally{URL.revokeObjectURL(url)}}
const dataURL=b=>new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(b)});
function download(name,content){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type:'application/json'}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)}
async function exportData(){try{if(loadBroken){download('liver-reset-recovery.json',localStorage.getItem(KEY)||'{}');return}const photos={};for(const k of ['before','after']){const b=await photoOp('readonly',s=>s.get(k));photos[k]=b?await dataURL(b):null}download(`liver-reset-${localISO()}.json`,JSON.stringify({...state,photos},null,2));toast('ส่งออกบันทึกพร้อมรูปแล้ว')}catch(e){if(confirm('อ่านรูปไม่ได้ ต้องการส่งออกเฉพาะบันทึกหรือไม่?'))download('liver-reset-records.json',JSON.stringify(state,null,2))}}
async function importData(file){try{if(file.size>20*1024*1024)throw Error('ไฟล์สำรองต้องไม่เกิน 20 MB');const raw=JSON.parse(await file.text()),next=validate(raw),blobs={};if(raw.photos!==undefined){if(!raw.photos||typeof raw.photos!=='object')throw Error('ข้อมูลรูปไม่ถูกต้อง');for(const k of ['before','after']){const p=raw.photos[k];if(p===null||p===undefined){blobs[k]=null;continue}if(typeof p!=='string'||!/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(p)||p.length>8e6)throw Error('รูปในไฟล์ไม่ถูกต้อง');const binary=atob(p.split(',')[1]);const blob=new Blob([Uint8Array.from(binary,c=>c.charCodeAt(0))],{type:p.slice(5,p.indexOf(';'))});blobs[k]=await compress(blob)}}if(!confirm('นำเข้าจะทับบันทึกปัจจุบันทั้งหมด'+(raw.photos!==undefined?'และรูปทั้งสอง':' (ไฟล์ไม่มีรูป: เก็บรูปเดิมไว้)')+' ต้องการดำเนินการต่อ?'))return;
// Snapshot both stores so a quota/write failure can be rolled back.
const oldText=localStorage.getItem(KEY),oldPhotos={};if(raw.photos!==undefined)for(const k of ['before','after'])oldPhotos[k]=await photoOp('readonly',s=>s.get(k));localStorage.setItem(KEY,JSON.stringify(next));try{if(raw.photos!==undefined)await photoOp('readwrite',s=>{s.clear();for(const k of ['before','after'])if(blobs[k])s.put(blobs[k],k)})}catch(e){if(oldText===null)localStorage.removeItem(KEY);else localStorage.setItem(KEY,oldText);throw e}state=next;draftAction=null;loadBroken=false;$('storageWarning').style.display='none';render();toast('กู้คืนข้อมูลเรียบร้อย')}catch(e){toast('นำเข้าไม่สำเร็จ: '+e.message)}finally{$('importFile').value=''}}
async function resetAll(){if(!confirm('ลบข้อมูลทุกวันและรูป Before/After ทั้งหมด? ยกเลิกได้ตอนนี้ แนะนำ Export ก่อน'))return;if(!confirm('ยืนยันอีกครั้ง: ข้อมูลที่ลบแล้วกู้คืนได้จากไฟล์สำรองเท่านั้น'))return;try{await photoOp('readwrite',s=>s.clear());localStorage.removeItem(KEY);state=fresh();draftAction=null;loadBroken=false;$('storageWarning').style.display='none';save();render();toast('ล้างข้อมูลเรียบร้อย')}catch(e){toast('ล้างข้อมูลไม่สำเร็จ: '+e.message)}}

/* SMART COMPANION V2 — local intent routing; no remote model, no API keys. */
function smartDefaults(){return {version:2,proteinTarget:null,sugarLimit:null,reminders:false,mealTime:'18:00',messages:[],notified:{}}}
function validate(raw){
 const out=validateLegacy(raw),cfg=raw.smart??smartDefaults(),base=smartDefaults();
 const bounded=(v,min,max)=>typeof v==='number'&&Number.isFinite(v)&&v>=min&&v<=max;
 for(const k of ['proteinTarget','sugarLimit']){const v=cfg[k]??null;if(v!==null&&!bounded(v,k==='proteinTarget'?1:0,k==='proteinTarget'?300:200))throw Error('เป้าหมายสารอาหารไม่ถูกต้อง');base[k]=v}
 if(cfg.reminders!==undefined&&typeof cfg.reminders!=='boolean')throw Error('รูปแบบเตือนไม่ถูกต้อง');base.reminders=cfg.reminders??false;
 if(cfg.mealTime!==undefined&&!/^([01]\d|2[0-3]):[0-5]\d$/.test(cfg.mealTime))throw Error('เวลาเตือนไม่ถูกต้อง');base.mealTime=cfg.mealTime??'18:00';
 if(cfg.messages!==undefined&&!Array.isArray(cfg.messages))throw Error('ประวัติแชตไม่ถูกต้อง');
 base.messages=(cfg.messages??[]).slice(-120).map(m=>{if(!m||!['user','assistant'].includes(m.role)||typeof m.text!=='string'||m.text.length>6000||!Number.isInteger(m.day)||m.day<0||m.day>29)throw Error('ข้อความแชตไม่ถูกต้อง');return {role:m.role,text:m.text,day:m.day}});
 if(cfg.notified&&typeof cfg.notified==='object')for(const d of dates)if(typeof cfg.notified[d]==='string')base.notified[d]=cfg.notified[d].slice(0,50);
 out.smart=base;
 out.days.forEach((d,i)=>{const src=raw.days[i];if(src.intake!==undefined&&!Array.isArray(src.intake))throw Error('บันทึกอาหารไม่ถูกต้อง');if((src.intake??[]).length>100)throw Error('อาหารเกิน 100 รายการในวันเดียว');const ids=new Set();d.intake=(src.intake??[]).map(e=>{if(!e||typeof e.id!=='string'||e.id.length>100||ids.has(e.id)||typeof e.name!=='string'||!e.name.trim()||e.name.length>120||typeof e.portion!=='string'||e.portion.length>180||!['breakfast','lunch','dinner','snack'].includes(e.meal))throw Error('รายการอาหารไม่ถูกต้อง');ids.add(e.id);if(!bounded(e.kcal,0,10000)||!bounded(e.protein,0,1000))throw Error('พลังงานหรือโปรตีนไม่ถูกต้อง');const clean={id:e.id,name:e.name,portion:e.portion,meal:e.meal,kcal:e.kcal,protein:e.protein,source:['estimate','label'].includes(e.source)?e.source:'estimate'};for(const k of ['carbs','fat','sugar']){const v=e[k]??null;if(v!==null&&!bounded(v,0,1000))throw Error('สารอาหารไม่ถูกต้อง');clean[k]=v}return clean});if(src.intakeClosed!==undefined&&typeof src.intakeClosed!=='boolean')throw Error('สถานะอาหารไม่ถูกต้อง');d.intakeClosed=src.intakeClosed??false});return out;
}

const round1=n=>Math.round((n+Number.EPSILON)*10)/10;
const makeId=()=>globalThis.crypto?.randomUUID?.()??('food-'+Date.now()+'-'+Math.random().toString(36).slice(2));
function totals(d){const list=d.intake??[],r={count:list.length,kcal:0,protein:0,carbs:0,fat:0,sugar:0,carbsMissing:0,fatMissing:0,sugarMissing:0,estimates:0};for(const e of list){r.kcal+=e.kcal;r.protein+=e.protein;if(e.source==='estimate')r.estimates++;for(const k of ['carbs','fat','sugar'])if(e[k]===null)r[k+'Missing']++;else r[k]+=e[k]}for(const k of ['kcal','protein','carbs','fat','sugar'])r[k]=round1(r[k]);return r}
function proteinText(d){const t=totals(d),target=state.smart.proteinTarget;if(!t.count)return 'ยังไม่มีบันทึกอาหารจริง จึงยังประเมินโปรตีนไม่ได้';if(target===null)return `บันทึกโปรตีนแล้ว ≈${fmt(t.protein)} กรัม ยังไม่ได้ตั้งเป้าหมายโปรตีนตามแพทย์ จึงยังบอกว่า “ถึงแล้ว” ไม่ได้`;return t.protein>=target?`โปรตีนที่บันทึก ≈${fmt(t.protein)} / ${fmt(target)} กรัม ถึงเป้าหมายที่ตั้งไว้แล้ว (ค่าประมาณ)`:`โปรตีนที่บันทึก ≈${fmt(t.protein)} / ${fmt(target)} กรัม ยังห่างจากเป้าหมาย ${fmt(target-t.protein)} กรัม ${d.intakeClosed?'ให้ทบทวนกับผู้ดูแลแผน':'บันทึกมื้อที่เหลือก่อนสรุปทั้งวัน'}`}
function sugarText(d){const t=totals(d),limit=state.smart.sugarLimit;if(!t.count)return 'ยังไม่มีอาหารจริง จึงยังประเมินน้ำตาลไม่ได้';const prefix=`น้ำตาลรวมที่ทราบ ≈${fmt(t.sugar)} กรัม${t.sugarMissing?` (ยังไม่ทราบ ${t.sugarMissing} รายการ)` : ''}`;if(limit===null)return prefix+' ยังไม่ได้ตั้งเกณฑ์น้ำตาลรวม จึงยังตัดสินว่าเกินหรือไม่ไม่ได้';if(t.sugar>limit)return prefix+` มากกว่าเกณฑ์เตือนที่ตั้ง ${fmt(limit)} กรัมแล้ว`;if(t.sugarMissing)return prefix+' ข้อมูลยังไม่ครบ จึงยังบอกว่าไม่เกินไม่ได้';return prefix+` ยังไม่เกินเกณฑ์ ${fmt(limit)} กรัมจากรายการที่บันทึก${d.intakeClosed?'':' แต่ยังไม่ได้ยืนยันอาหารครบวัน'}`}
function smartAlerts(d){const t=totals(d),a=[];if(!t.count)return ['ยังไม่มีบันทึกอาหารจริง เช็กลิสต์ “กินแล้ว” ไม่นำมาคำนวณสารอาหารอัตโนมัติ'];if(t.kcal>700)a.push(`พลังงานที่บันทึก ≈${fmt(t.kcal)} kcal มากกว่าขอบบนแผน 700 kcal ตรวจปริมาณ/ฉลากก่อน อย่าอดมื้อถัดไปหรือออกกำลังเพื่อชดเชย หากเกิดซ้ำให้ทบทวนแผนกับแพทย์`);else if(d.intakeClosed&&t.kcal<500)a.push(`ยืนยันครบวันแล้ว แต่รวมเพียง ≈${fmt(t.kcal)} kcal ต่ำกว่า 500 kcal ตรวจว่าบันทึกครบหรือไม่ ไม่ควรลดอาหารหรือเพิ่มการออกกำลังอีก และปรึกษาผู้ดูแลแผน`);else a.push(`พลังงานที่บันทึก ≈${fmt(t.kcal)} kcal${d.intakeClosed?' · ยืนยันอาหารครบวันแล้ว':' · ยังไม่สรุปว่าพอทั้งวันจนกว่าจะบันทึกครบ'}`);if(t.sugarMissing||state.smart.sugarLimit!==null)a.push(sugarText(d));if(state.smart.proteinTarget!==null)a.push(proteinText(d));return a}

function tickSmartReminders(){if(!state.smart.reminders||document.hidden)return;const idx=todayIndex();if(idx<0||idx>29)return;const d=state.days[idx],n=new Date(),time=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');if(time<state.smart.mealTime||d.intakeClosed||state.smart.notified[d.date]===state.smart.mealTime)return;state.smart.notified[d.date]=state.smart.mealTime;save();toast('เตือนประจำวัน: ตรวจอาหารจริง โปรตีน และน้ำตาล แล้วสรุปให้ครบวัน');}

function foodFromDB(f,qty=1,meal='snack',byGrams=false){const ratio=byGrams?qty/f.grams:qty,e={id:makeId(),name:f.name,portion:byGrams?`${fmt(qty)} กรัม`:`${fmt(qty)} × ${f.portion}`,meal,source:'estimate'};for(const k of ['kcal','protein','carbs','fat','sugar'])e[k]=f[k]===null?null:round1(f[k]*ratio);return e}
function editorFields(e){return `<input type="hidden" name="id" value="${esc(e.id)}"><label>ชื่ออาหาร<input name="name" maxlength="120" required value="${esc(e.name)}"></label><div class="grid"><label>มื้อ<select name="meal">${Object.entries(mealLabels).map(([k,v])=>`<option value="${k}" ${e.meal===k?'selected':''}>${v}</option>`).join('')}</select></label><label>ปริมาณที่กินจริง<input name="portion" maxlength="180" required value="${esc(e.portion)}" placeholder="เช่น 1 ซอง 100 กรัม"></label></div><div class="grid">${[['kcal','พลังงาน (kcal)',10000],['protein','โปรตีน (g)',1000],['carbs','คาร์บ (g)',1000],['fat','ไขมัน (g)',1000],['sugar','น้ำตาลรวม (g)',1000]].map(([k,label,max])=>`<label>${label}<input name="${k}" type="number" inputmode="decimal" min="0" max="${max}" step="0.1" ${['kcal','protein'].includes(k)?'required':''} value="${e[k]??''}" placeholder="${['kcal','protein'].includes(k)?'จำเป็น':'ไม่ทราบ: เว้นว่าง'}"></label>`).join('')}</div><label>ที่มาค่าอาหาร<select name="source"><option value="estimate" ${e.source==='estimate'?'selected':''}>ค่าประมาณ / คำนวณเอง</option><option value="label" ${e.source==='label'?'selected':''}>กรอกตามฉลากจริง</option></select></label><p class="small">ค่าด้านบนต้องเป็นยอดรวมของปริมาณที่กินจริง หากฉลากต่อ 1 หน่วยแต่กิน 2 หน่วยให้คูณทุกค่าด้วย 2 ช่องน้ำตาลว่างหมายถึงไม่ทราบ ไม่ใช่ 0</p>`}
function showFoodEditor(id=null){foodEditorDay=selected;foodEditorId=id;const e=id?day().intake.find(x=>x.id===id):{id:makeId(),name:'',portion:'',meal:'snack',kcal:null,protein:null,carbs:null,fat:null,sugar:null,source:'label'};if(!e)return;showModal(`${id?'แก้ไข':'บันทึก'}อาหาร · DAY ${selected+1}`,`${id?'':`<details class="section" open><summary>เลือกค่าประมาณ หรือกรอกฉลากเองด้านล่าง</summary><div class="stack section"><select id="foodPreset" aria-label="เลือกอาหาร"><option value="">เลือกเมนูที่รู้จัก</option>${foodDB.map(f=>`<option value="${f.id}">${f.name}</option>`).join('')}</select><div class="grid"><label>จำนวน<input id="presetQty" type="number" min="0.1" max="5000" step="0.1" value="1"></label><label>หน่วย<select id="presetUnit"><option value="portion">หน่วยมาตรฐาน</option><option value="grams">กรัม</option></select></label></div><button data-smart="applyPreset">นำค่าใส่แบบฟอร์ม</button></div></details>`}<form id="foodEditorForm" class="stack section">${editorFields(e)}<button class="primary">${id?'บันทึกการแก้ไข':'ยืนยันเพิ่มรายการ'}</button>${id?'<button type="button" class="danger" data-smart="deleteFood">ลบรายการนี้</button>':''}</form>`)}
function persistFood(e,idx,id=null){const candidate=JSON.parse(JSON.stringify(state)),d=candidate.days[idx];if(id){const i=d.intake.findIndex(x=>x.id===id);if(i<0)throw Error('ไม่พบรายการเดิม');d.intake[i]=e}else d.intake.push(e);d.intakeClosed=false;if(e.meal!=='snack')d[e.meal+'Complete']=true;state=validate(candidate);return save()}
function applyPreset(){const f=foodDB.find(x=>x.id===$('foodPreset').value),qty=Number($('presetQty').value);if(!f||!Number.isFinite(qty)||qty<=0||qty>5000){toast('เลือกเมนูและปริมาณที่ถูกต้องก่อน');return}const e=foodFromDB(f,qty,'snack',$('presetUnit').value==='grams'),form=$('foodEditorForm');for(const k of ['name','portion','kcal','protein','carbs','fat','sugar','source'])form.elements[k].value=e[k]??'';toast('ใส่ค่าประมาณแล้ว ตรวจและแก้ก่อนยืนยัน')}
/* Conservative intent parser: ambiguous or unknown foods never silently disappear. */
function normalizeThaiNumbers(s){return s.replace(/[๐-๙]/g,c=>String('๐๑๒๓๔๕๖๗๘๙'.indexOf(c))).replace(/(หนึ่ง|สอง|สาม|สี่|ห้า|หก|เจ็ด|แปด|เก้า|สิบ)(?=\s*(ฟอง|ชิ้น|จาน|ถ้วย|แก้ว|กระป๋อง|ทัพพี|ที่))/g,w=>String(['','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า','สิบ'].indexOf(w)))}
function chatDay(text){const t=normalizeThaiNumbers(text);if(/วันนี้/.test(t))return todayIndex();if(/เมื่อวาน/.test(t))return todayIndex()-1;const m=t.match(/(?:day\s*|วันที่\s*)(\d{1,2})(?:\s*ของแผน)?/i);if(m)return Number(m[1])-1;return selected}
function stripContext(t){return t.replace(/(?:day\s*|วันที่\s*)\d{1,2}(?:\s*ของแผน)?/gi,'').replace(/วันนี้|เมื่อวาน|วันที่เลือก/g,'')}
function parseFoodText(text){let s=stripContext(normalizeThaiNumbers(text.toLowerCase()));let meal=/มื้อเช้า|ตอนเช้า|เมื่อเช้า/.test(s)?'breakfast':/มื้อกลางวัน|ตอนเที่ยง/.test(s)?'lunch':/มื้อเย็น|ตอนเย็น/.test(s)?'dinner':'snack';s=s.replace(/มื้อเช้า|ตอนเช้า|เมื่อเช้า|มื้อกลางวัน|ตอนเที่ยง|มื้อเย็น|ตอนเย็น|ของว่าง/g,'').trim().replace(/^(?:ช่วย\s*)?(?:บันทึก|เพิ่มอาหาร|เพิ่ม|กินแล้ว|กิน|ทานแล้ว|ทาน)\s*/,'').replace(/(?:ได้ไหม|ได้มั้ย|ได้มั๊ย|ได้หรือเปล่า|เหมาะไหม|ดีไหม|ดีมั้ย|ไหม|มั้ย|ครับ|ค่ะ|คะ)[?？!]?/g,'').replace(/แล้ว\s*$/,'').trim();
 const parts=s.split(/\s*(?:แล้วก็|และ|กับ|\+|,)\s*/).filter(Boolean),entries=[],unknown=[];
 for(const part of parts){let found=null;for(const f of foodDB)for(const alias of f.aliases)if(part.includes(alias)&&(!found||alias.length>found.alias.length))found={f,alias};if(!found){unknown.push(part);continue}let rest=part.replace(found.alias,'').trim();const qtyMatch=rest.match(/^(\d+(?:\.\d+)?)\s*(กรัม|g|ฟอง|ชิ้น|จาน|ถ้วย|แก้ว|กระป๋อง|ทัพพี|ที่|หน่วย)?$/i);if(rest&&!qtyMatch){unknown.push(part);continue}const qty=qtyMatch?Number(qtyMatch[1]):1,unit=qtyMatch?.[2],grams=/^(กรัม|g)$/i.test(unit??'');if(!Number.isFinite(qty)||qty<=0||qty>5000||unit&&!grams&&unit!==found.f.unit&&unit!=='หน่วย'){unknown.push(part+' (หน่วยไม่ตรง)');continue}entries.push(foodFromDB(found.f,qty,meal,grams));}
 return {entries,unknown};
}

function foodAssessment(entries,idx){const fake={intake:entries},add=totals(fake),d=state.days[idx],t=totals(d),projected=round1(t.kcal+add.kcal);return entries.map(e=>`${e.name} · ${e.portion}: ≈${fmt(e.kcal)} kcal / โปรตีน ${fmt(e.protein)} g / น้ำตาล ${e.sugar===null?'ไม่ทราบ':fmt(e.sugar)+' g'}`).join('\n')+`\nถ้ากินเพิ่มจากรายการที่บันทึก จะรวม ≈${fmt(projected)} kcal${projected>700?' มากกว่า 700 kcal ในแผนนี้':' (เป็นเพียงยอดระหว่างวัน ไม่ใช่คำรับรองว่าเหมาะสม)'}\nโปรตีนรวมหลังเพิ่ม ≈${fmt(t.protein+add.protein)} g${state.smart.proteinTarget===null?' (ยังไม่ตั้งเป้า)':' / เป้า '+fmt(state.smart.proteinTarget)+' g'}\nน้ำตาลรวมที่ทราบหลังเพิ่ม ≈${fmt(t.sugar+add.sugar)} g${state.smart.sugarLimit===null?' (ยังไม่ตั้งเกณฑ์)':t.sugar+add.sugar>state.smart.sugarLimit?' เกินเกณฑ์ '+fmt(state.smart.sugarLimit)+' g แล้ว':' / เกณฑ์ '+fmt(state.smart.sugarLimit)+' g'}\n${add.sugarMissing||t.sugarMissing?'บางรายการไม่ทราบน้ำตาล จึงยังสรุปว่าไม่เกินไม่ได้':'น้ำตาลที่แสดงเป็นน้ำตาลรวม ไม่ใช่น้ำตาลเติม'}\nยังไม่บันทึกอาหารจากคำถามนี้ หากกินจริง พิมพ์ “บันทึก …” และตรวจปริมาณก่อนยืนยัน`}

function respondChat(raw){const text=normalizeThaiNumbers(raw.trim()).slice(0,700);if(!text)return;draftAction=null;let idx=chatDay(text);const validDay=idx>=0&&idx<30;

 selected=idx;appendChat('user',text,idx);const d=state.days[idx];let answer='';const scoped=stripContext(text);

 else if(/แก้.*อาหาร|ลบ.*อาหาร|แก้.*รายการ/.test(scoped)){answer='กด “รายการอาหาร” แล้วเลือกแก้ไขข้างเมนู เพื่อเปลี่ยนชื่อ ปริมาณ พลังงาน โปรตีน น้ำตาล หรือลบรายการได้';}
 else if(/ตั้ง.*โปรตีน|ตั้ง.*น้ำตาล|เป้าหมายสารอาหาร|ตั้ง.*เตือน/.test(scoped)){answer='กด “ตั้งเป้าสารอาหาร” เพื่อกรอกเป้าหมายที่แพทย์ให้ และเวลาเตือนในแอป ช่องว่างหมายถึงยังไม่กำหนด ไม่ถือว่าเป็นศูนย์';}
 else if(/(?:บันทึก|แก้|ตั้ง|เปลี่ยน).*(?:น้ำหนัก|ก้าว)/.test(scoped)){const isWeight=/น้ำหนัก/.test(scoped),m=scoped.match(isWeight?/น้ำหนัก\s*(?:เป็น|วันนี้|เท่ากับ)?\s*(\d+(?:\.\d+)?)/:/ก้าว\s*(?:เป็น|วันนี้|เท่ากับ)?\s*(\d+(?:,\d{3})*(?:\.\d+)?)/);let value=m?Number(m[1].replace(/,/g,'')):NaN;if(!isWeight&&!m){const rev=scoped.match(/(\d+(?:,\d{3})*)\s*ก้าว/);if(rev)value=Number(rev[1].replace(/,/g,''))}if(!Number.isFinite(value)||isWeight&&(value<20||value>400)||!isWeight&&(value<0||value>100000||!Number.isInteger(value)))answer='อ่านตัวเลขไม่ได้หรืออยู่นอกช่วงที่รองรับ ลอง “บันทึกน้ำหนัก 65.5” หรือ “ตั้งก้าว 8450”';else{draftAction={type:isWeight?'weight':'steps',day:idx,value};answer=`ตรวจคำสั่ง: ตั้ง${isWeight?'น้ำหนัก':'จำนวนก้าว'} DAY ${idx+1} จาก ${fmt(d[isWeight?'weight':'steps'])} เป็น ${fmt(value)} ${isWeight?'กก.':'ก้าว'} กดยืนยันด้านล่างก่อนเปลี่ยน`}}
 else if(/^(?:ช่วย\s*)?(?:บันทึก|เพิ่มอาหาร|เพิ่ม|กินแล้ว|ทานแล้ว)/.test(scoped.trim())||/^(?:(?:มื้อเช้า|ตอนเช้า|เมื่อเช้า|มื้อกลางวัน|ตอนเที่ยง|มื้อเย็น|ตอนเย็น)\s*)?(?:กิน|ทาน)/.test(scoped.trim())&&!/อะไร|ได้ไหม|ได้มั้ย|ได้มั๊ย|ดีไหม|ดีมั้ย|หรือยัง|รึยัง|เกิน|เท่าไร|เท่าไหร่/.test(scoped)){const p=parseFoodText(text);if(p.unknown.length||!p.entries.length)answer=`ยังไม่บันทึก เพราะอ่านรายการ/ปริมาณไม่ครบ: ${p.unknown.join(', ')||text}\nใช้ชื่อเมนูที่รู้จักกับหน่วยให้ตรง เช่น “บันทึก ไข่ต้ม 2 ฟอง กับ อกไก่ 100 กรัม” หรือกดเพิ่มอาหารเพื่อกรอกเอง ห้ามถือว่าเมนูไม่รู้จักมี 0 kcal`;else{draftAction={type:'food',day:idx,entries:p.entries};answer=`รอยืนยัน ${p.entries.length} รายการใน DAY ${idx+1}\n`+p.entries.map(e=>`${mealLabels[e.meal]} · ${e.name}\n${e.portion}\n≈${fmt(e.kcal)} kcal / โปรตีน ${fmt(e.protein)} g / น้ำตาล ${e.sugar===null?'ไม่ทราบ':fmt(e.sugar)+' g'}`).join('\n')+'\nค่าประมาณ ไม่ใช่ฉลากสินค้า ถ้าปริมาณไม่ตรงให้ยกเลิกแล้วใช้แบบฟอร์ม ไม่บันทึกจนกด “ยืนยัน”'}}
 else if(/(?:กิน|เมนู|ทาน).*(?:อะไรดี|อะไรได้)|แนะนำ.*เมนู|เมนูวันนี้/.test(scoped))answer=menuReply(idx);
 else if(/โปรตีน/.test(scoped)&&!/ได้ไหม|ได้มั้ย/.test(scoped))answer=proteinText(d)+(totals(d).kcal>=700?'\nพลังงานถึงขอบบนแล้ว ไม่แนะนำเพิ่มอาหารหรือออกกำลังเพื่อไล่ตัวเลขโปรตีน ให้ปรึกษาผู้ดูแลเพื่อจัดสัดส่วนแผน':'\nหากยังไม่ถึง ให้จัดสัดส่วนอาหารตามแผนร่วมกับแพทย์ ไม่เพิ่มอาหารเพียงเพื่อไล่ตัวเลข');

 else if(/สถิติ|สะสม|รายสัปดาห์/.test(scoped))answer=cumulativeText();

}
function renderAssistant(){return `<section class="card smart-hero"><div class="eyebrow">YOUR EVERYDAY COMPANION</div><h2>คุยก่อนเลือก กินอย่างเข้าใจ ✦</h2><p class="small">ผู้ช่วยตามกฎในเครื่อง • ไม่ใช่ AI ออนไลน์ • อ้างอิงข้อมูลที่คุณบันทึก</p><span class="badge section">กำลังดู DAY ${selected+1} · ${dates[selected]}</span></section><div class="quick-prompts section">${['กินอะไรดี','โปรตีนถึงรึยัง','น้ำตาลเกินไหม','สรุปวันที่เลือก','สถิติสะสม','ออกกำลังอะไรดี'].map(t=>`<button data-prompt="${esc(t)}">${esc(t)}</button>`).join('')}</div><div id="chatHistory" class="chat-history section" role="log" aria-label="บทสนทนา">${state.smart.messages.length?state.smart.messages.slice(-60).map(m=>`<article class="chat-bubble ${m.role==='user'?'mine':''}"><div class="small">${m.role==='user'?'คุณ':'ผู้ช่วยในเครื่อง'} · DAY ${m.day+1}</div><p>${esc(m.text)}</p></article>`).join(''):`<article class="chat-bubble"><p>${esc(chatHelp())}</p></article>`}</div>${draftAction?`<div class="notice section"><strong>รอการยืนยัน · DAY ${draftAction.day+1}</strong><p class="small">ข้อมูลยังไม่เปลี่ยน ตรวจตัวเลขในคำตอบด้านบนก่อน</p><div class="toolbar section"><button class="primary" data-smart="confirmDraft">ยืนยัน${draftAction.type==='food'?'บันทึกอาหาร':'เปลี่ยนข้อมูล'}</button><button data-smart="cancelDraft">ยกเลิก</button></div></div>`:''}<form id="chatForm" class="chat-compose section"><label for="chatInput" class="small">พิมพ์คำถามหรือคำสั่ง · ใช้ไมค์บนคีย์บอร์ด iPhone ได้</label><textarea id="chatInput" name="message" rows="2" maxlength="700" required placeholder="บันทึกมื้อเย็น ไข่ต้ม 2 ฟอง กับ อกไก่ 100 กรัม"></textarea><button class="primary" type="submit">ส่งข้อความ ↑</button></form><div class="toolbar section"><button data-smart="food">เพิ่มอาหาร / ฉลาก</button><button data-smart="ledger">รายการอาหาร</button><button data-smart="nutritionSettings">ตั้งเป้าสารอาหาร</button><button data-smart="clearChat">ล้างแชต</button></div><p class="small section">การยืนยันแก้ไขข้อมูลเป็นของวันที /* Cumulative intake: only complete days enter daily averages; incomplete sugar stays unknown. */
function nutritionStats(range=statsRange){const end=Math.min(29,todayIndex()),start=range==='7'?Math.max(0,end-6):0,rows=end<0?[]:state.days.slice(start,end+1),logged=rows.filter(d=>d.intake.length),closed=logged.filter(d=>d.intakeClosed),sum=key=>round1(logged.reduce((n,d)=>n+totals(d)[key],0)),avg=key=>closed.length?round1(closed.reduce((n,d)=>n+totals(d)[key],0)/closed.length):null,knownSugar=closed.filter(d=>totals(d).sugarMissing===0);return {start,end,rows,logged,closed,kcal:sum('kcal'),protein:sum('protein'),sugar:sum('sugar'),missing:logged.reduce((n,d)=>n+totals(d).sugarMissing,0),avgKcal:avg('kcal'),avgProtein:avg('protein'),avgSugar:knownSugar.length?round1(knownSugar.reduce((n,d)=>n+totals(d).sugar,0)/knownSugar.length):null,knownSugarDays:knownSugar.length,proteinReached:state.smart.proteinTarget===null?null:closed.filter(d=>totals(d).protein>=state.smart.proteinTarget).length,overSugar:state.smart.sugarLimit===null?null:logged.filter(d=>totals(d).sugar>state.smart.sugarLimit).length}}
function cumulativeText(){const s=nutritionStats('30');return `สะสมตั้งแต่เริ่มถึงวันนี้ (ไม่รวมวันอนาคต)\nบันทึกอาหาร ${s.logged.length} วัน ยืนยันครบวัน ${s.closed.length} วัน\nพลังงานบันทึกรวม ≈${fmt(s.kcal)} kcal\nโปรตีนบันทึกรวม ≈${fmt(s.protein)} กรัม\nน้ำตาลรวมที่ทราบ ≈${fmt(s.sugar)} กรัม${s.missing?` · ไม่ทราบ ${s.missing} รายการ`:''}\nเฉลี่ยเฉพาะวันที่ยืนยันครบ: ${fmt(s.avgKcal)} kcal / โปรตีน ${fmt(s.avgProtein)} g ต่อวัน\n${s.closed.length?'':'ยังไม่มีวันที่ยืนยันครบ จึงยังไม่มีค่าเฉลี่ยที่ใช้สรุปทั้งวันได้\n'}ดูกราฟ 7/30 วันได้ที่หน้าความคืบหน้า ไม่ใช้แคลอรีออกกำลังมาหักอาหาร`}
function intakeChart(s){if(!s.rows.length)return '<p class="small section">โปรแกรมยังไม่เริ่ม สถิติสะสมจะไม่นับวันอนาคต</p>';const max=Math.max(800,...s.rows.map(d=>totals(d).kcal)),xstep=310/s.rows.length,y=v=>150-v/max*120;return `<svg viewBox="0 0 365 180" class="chart" role="img" aria-label="พลังงานที่บันทึกจริงรายวัน หน่วยกิโลแคลอรี">${[500,700].map(n=>`<path d="M 35 ${y(n)} H 350" stroke="var(--orange)" stroke-dasharray="4 4"/><text x="0" y="${y(n)+4}" font-size="9" fill="currentColor">${n}</text>`).join('')}${s.rows.map((d,i)=>{const t=totals(d);return `<rect x="${35+i*xstep}" y="${y(t.kcal)}" width="${Math.max(2,xstep-3)}" height="${Math.max(1,150-y(t.kcal))}" rx="2" fill="${t.count?'var(--accent)':'var(--line)'}" opacity="${d.intakeClosed?1:.35}"><title>DAY ${s.start+i+1}: ${t.count?t.kcal+' kcal':'ไม่บันทึก'} · ${d.intakeClosed?'ครบวัน':'ยังไม่ครบ'}</title></rect>`}).join('')}<text x="35" y="170" fill="currentColor" font-size="10">DAY ${s.start+1}</text><text x="300" y="170" fill="currentColor" font-size="10">DAY ${s.end+1}</text></svg><p class="small">สีเข้ม: ยืนยันครบวัน · สีจาง: ยังไม่ครบ · ขีดเทา: ไม่มีข้อมูล<br>เส้นประ 500 / 700 kcal เป็นกรอบแผนแพทย์ ไม่ใช่เป้าหมายสำหรับบุคคลทั่วไป</p>`}
function renderNutritionStats(){const s=nutritionStats(),metrics=[['พลังงานสะสมที่บันทึก',fmt(s.kcal)+' kcal'],['โปรตีนสะสมที่บันทึก',fmt(s.protein)+' g'],['น้ำตาลรวมที่ทราบ',fmt(s.sugar)+' g'],['ยืนยันอาหารครบวัน',s.closed.length+' วัน'],['พลังงานเฉลี่ย / วันครบ',fmt(s.avgKcal)+' kcal'],['โปรตีนเฉลี่ย / วันครบ',fmt(s.avgProtein)+' g']];return `<section class="card section"><div class="row"><h3>สถิติอาหารจริงสะสม</h3><select id="statsRange" aria-label="ช่วงสถิติ" style="max-width:115px"><option value="30" ${statsRange==='30'?'selected':''}>ตั้งแต่เริ่ม</option><option value="7" ${statsRange==='7'?'selected':''}>7 วันล่าสุด</option></select></div><p class="small">นับถึงวันนี้ ไม่รวมอนาคต · บันทึก ${s.logged.length} วัน</p><div class="grid section">${metrics.map(([k,v])=>`<div class="stat-tile"><p class="small">${k}</p><strong>${v}</strong></div>`).join('')}</div>${intakeChart(s)}<p class="small section">น้ำตาลไม่ทราบ ${s.missing} รายการ · เฉลี่ยน้ำตาล ${fmt(s.avgSugar)} g เฉพาะ ${s.knownSugarDays} วันที่ยืนยันครบและทราบน้ำตาลทุกรายการ<br>ถึงเป้าโปรตีน ${s.proteinReached===null?'ยังไม่ได้ตั้งเป้า':s.proteinReached+' / '+s.closed.length+' วันครบ'} · เกินเกณฑ์น้ำตาล ${s.overSugar===null?'ยังไม่ได้ตั้งเกณฑ์':s.overSugar+' วันที่มีบันทึก'}</p><button class="section" data-smart="exportCSV">ส่งออกสถิติอาหาร CSV</button><details class="section"><summary>ยอดรายวันและความครบของข้อมูล</summary>${s.rows.map((d,i)=>{const t=totals(d);return `<div class="intake-item"><div class="row"><strong>DAY ${s.start+i+1}</strong><button data-day="${s.start+i}">ดูวัน</button></div><p class="small">${t.count?`≈${fmt(t.kcal)} kcal · โปรตีน ${fmt(t.protein)} g · น้ำตาลที่ทราบ ${fmt(t.sugar)} g${t.sugarMissing?' + บางรายการไม่ทราบ':''}`:'ยังไม่บันทึกอาหาร'} · ${d.intakeClosed?'ยืนยันครบวัน':'ยังไม่ยืนยัน'}</p></div>`}).join('')}</details></section>`}
function exportNutritionCSV(){const header=['date','day','entries','complete_day','kcal_logged','protein_g_logged','total_sugar_g_known','sugar_unknown_entries','protein_target_g','total_sugar_alert_g','weight_kg','steps'],rows=state.days.map((d,i)=>{const t=totals(d);return [d.date,i+1,t.count,d.intakeClosed,t.count?t.kcal:'',t.count?t.protein:'',t.count?t.sugar:'',t.sugarMissing,state.smart.proteinTarget??'',state.smart.sugarLimit??'',d.weight??'',d.steps??'']});const csv='\uFEFF'+[header,...rows].map(r=>r.join(',')).join('\r\n'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='liver-reset-nutrition.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);toast('ส่งออกสถิติอาหาร 30 วันแล้ว')}
/* Event wiring. New fields survive legacy settings, backup, import and refresh. */
document.addEventListener('submit',e=>{const f=e.target;if(!['chatForm','foodEditorForm','nutritionSettingsForm'].includes(f.id))return;e.preventDefault();const v=new FormData(f);try{
 if(f.id==='chatForm'){respondChat(v.get('message'));return}
 if(f.id==='nutritionSettingsForm'){const candidate=JSON.parse(JSON.stringify(state));for(const k of ['proteinTarget','sugarLimit'])candidate.smart[k]=v.get(k)===''?null:Number(v.get(k));candidate.smart.reminders=v.has('reminders');candidate.smart.mealTime=v.get('mealTime');state=validate(candidate);const ok=save();$('modal').close();render();if(ok)toast('บันทึกเป้าหมายแล้ว');tickSmartReminders();return}
 const item={id:String(v.get('id')),name:String(v.get('name')).trim(),portion:String(v.get('portion')).trim(),meal:String(v.get('meal')),source:String(v.get('source'))};for(const k of ['kcal','protein','carbs','fat','sugar'])item[k]=v.get(k)===''?null:Number(v.get(k));const ok=persistFood(item,foodEditorDay,foodEditorId);$('modal').close();render();if(ok)toast('บันทึกอาหารจริงแล้ว');
 }catch(err){toast('บันทึกไม่ได้: '+err.message)}});
document.addEventListener('change',e=>{if(e.target.id==='intakeClosed'){day().intakeClosed=e.target.checked;if(save())toast(e.target.checked?'ยืนยันอาหารครบวันแล้ว':'กลับเป็นบันทึกระหว่างวัน');render()}if(e.target.id==='statsRange'){statsRange=e.target.value;render()}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.smart;if(b.dataset.prompt){respondChat(b.dataset.prompt);return}if(b.dataset.editFood){showFoodEditor(b.dataset.editFood);return}if(a==='chat'){page='assistant';render();window.scrollTo(0,0)}if(a==='ledger'){page='meals';render()}if(a==='food')showFoodEditor();if(a==='applyPreset')applyPreset();if(a==='nutritionSettings')showNutritionSettings();if(a==='exportCSV')exportNutritionCSV();if(a==='clearChat'&&confirm('ล้างประวัติแชตทั้งหมด? บันทึกอาหารและสุขภาพจะยังอยู่')){state.smart.messages=[];draftAction=null;save();render()}if(a==='cancelDraft'){draftAction=null;appendChat('assistant','ยกเลิกคำสั่งแล้ว ข้อมูลไม่เปลี่ยน');save();render()}if(a==='confirmDraft'&&draftAction){const pending=draftAction;try{const candidate=JSON.parse(JSON.stringify(state)),d=candidate.days[pending.day];if(pending.type==='food'){d.intake.push(...pending.entries);d.intakeClosed=false;pending.entries.forEach(e=>{if(e.meal!=='snack')d[e.meal+'Complete']=true})}else d[pending.type]=pending.value;state=validate(candidate);draftAction=null;const ok=save();appendChat('assistant',`${ok?'บันทึกแล้ว':'เปลี่ยนเฉพาะในหน้านี้ แต่บันทึกลงเครื่องไม่สำเร็จ กรุณา Export ก่อนปิด'} · DAY ${pending.day+1}\n${chatSummary(pending.day)}`,pending.day);save();selected=pending.day;render()}catch(err){toast('ยังไม่บันทึก: '+err.message)}}if(a==='deleteFood'&&foodEditorId&&confirm('ลบอาหารรายการนี้จากยอดรวมจริง? เช็กลิสต์มื้ออาหารจะคงเดิม')){state.days[foodEditorDay].intake=state.days[foodEditorDay].intake.filter(x=>x.id!==foodEditorId);state.days[foodEditorDay].intakeClosed=false;const ok=save();$('modal').close();render();if(ok)toast('ลบรายการและคำนวณยอดใหม่แล้ว')}});
setInterval(tickSmartReminders,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tickSmartReminders()});

render();
tickSmartReminders();
</script></body></html>
